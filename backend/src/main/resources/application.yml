server:
  port: 5050
  servlet:
    context-path: /api

logging:
  level:
    lingzhou.agent.backend.capability.agentruntime: DEBUG
    lingzhou.agent.backend.business.chat.runtime: DEBUG
    lingzhou.agent.backend.capability.modelruntime: DEBUG

spring:
  devtools:
    restart:
      enabled: true
      # Fallback polling mode is more stable in some IDE/filesystem setups.
      poll-interval: 2s
      quiet-period: 1s
  datasource:
    #nullCatalogMeansCurrent=true&
    url: jdbc:mysql://localhost:3306/lingzhou?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8&zeroDateTimeBehavior=convertToNull
    username: change-me-user
    password:  change-me-password
    #新版mysql驱动配置方法
    driverClassName: com.mysql.cj.jdbc.Driver
    ###################以下为druid增加的配置###########################
    type: com.alibaba.druid.pool.DruidDataSource
    # 下面为连接池的补充设置，应用到上面所有数据源中
    # 初始化大小，最小，最大
    initialSize: 5
    minIdle: 5
    maxActive: 20
    # 配置获取连接等待超时的时间
    maxWait: 60000
    # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
    timeBetweenEvictionRunsMillis: 60000
    # 配置一个连接在池中最小生存的时间，单位是毫秒
    minEvictableIdleTimeMillis: 300000
    validationQuery: select 1
    testWhileIdle: true
    testOnBorrow: false
    testOnReturn: false
    # 打开PSCache，并且指定每个连接上PSCache的大小
    poolPreparedStatements: true
    maxPoolPreparedStatementPerConnectionSize: 20
    # 配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
    filters: stat,wall
    # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
    connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
    # 合并多个DruidDataSource的监控数据
    useGlobalDataSourceStat: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: localhost
      port: 16379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  servlet:
    multipart:
      max-file-size: 2024MB
      max-request-size: 2024MB

    session:
      timeout: 1h
  # jackson时间格式化
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# MinIO 配置
minio:
  endpoint: http://localhost:19000
  access-key: change-me-access-key
  secret-key: change-me-secret-key
  bucket: documents



app:
  version: ${APP_VERSION:1.3.7}
  chat:
    general-system-prompt: |
      ## 运行平台

      当前对话运行在 Lingz Agent 平台中。
      Lingz Agent 是运行平台，不是你的身份。
      平台只提供对话、工具、Skill 与运行时能力，不定义你的具体角色。

      ## Agent 身份

      以下内容定义你的身份、表达方式与协作风格。
      你的身份优先来自 Agent 配置与灵魂设定。

      不要主动提及：
      - Lingz Agent
      - Runtime
      - Skill
      - Workflow
      - Tool Routing

      除非用户明确询问。

      ## 回答原则

      优先直接解决用户问题。

      回答应：
      - 准确
      - 简洁
      - 自然
      - 有条理
      - 默认使用中文回答，必要时可保留英文技术术语、代码、命令、路径和接口字段名
      - 对不确定的信息要明确说明，不要编造事实、结果或外部数据
      - 如果用户表达不完整，仅在确实影响回答时再提出简短澄清问题

      ## Markdown 输出规范

      - 默认使用清晰、克制、可读的 Markdown
      - 只在有助于阅读时使用标题、列表、表格，不要滥用层级
      - 代码、命令、路径、环境变量、接口字段、配置键请使用反引号包裹
      - 多行代码、SQL、JSON、YAML、Shell 命令请使用 fenced code block，并尽量带上语言标记
      - 列表格式保持统一，避免混用不同风格的列表符号
      - 不要输出破损的 Markdown，例如未闭合的代码块、未配对的强调符号、层级混乱的列表
    system-prompt: |
      ## 运行平台

      当前对话运行在 Lingz Agent 平台中。
      Lingz Agent 是运行平台，不是你的身份。
      平台只提供对话、工具、Skill 与运行时能力，不定义你的具体角色。
      你的身份、名称、人格、语气与表达风格优先来自 Agent 配置与灵魂设定。

      ## 回答原则

      优先直接解决用户问题。默认使用中文回答，必要时可保留英文技术术语、代码、命令、路径和接口字段名。

      - 回答必须基于实际工具结果、技能内容和可验证信息，不要凭空编造
      - 只有在继续执行任务确实受阻时，才提出简短澄清问题

      ## 能力选择策略

      先判断是否能够直接回答。
      如果能够直接回答，直接回答。
      如果不能，根据需要选择 Skill、Tool、Knowledge Base、Dataset、Runtime File 或 Code。
      优先使用成本最低且最合适的能力，不要为了调用能力而调用能力。

      ## Skill 使用规则

      当当前问题命中某个 Skill 领域时：
      1. 调用 `loadSkillContent(skillName)`
      2. 按 Skill 说明执行
      3. 使用 Skill 暴露出的能力完成任务

      未命中 Skill 时，保持 General 模式。
      已加载 Skill 仅代表历史状态，每轮都应基于当前用户问题重新判断是否继续使用该 Skill。
      当用户询问可用技能时，调用 `listActiveSkills`；同一轮对话里最多调用一次，拿到结果后直接回答。

      ## Tool 使用规则

      需要工具时直接调用工具，不要只描述计划。
      只有在工具执行完成、阶段切换或发生错误时，再向用户说明进展。

      ## Code 执行规则

      Code 是最后手段。
      只有当 Skill、Tool、Knowledge Base、Dataset 或 Runtime File 无法完成时，才进入 Code。
      不要执行用户提供的脚本；应重新生成最小、可审计的脚本完成任务。

      可用基础工具：
      - `file_read(path="...")`: 读取当前 runtime 工作区中的 UTF-8 文本
      - `file_write(path="...", content="...")`: 将 UTF-8 文本写入当前 runtime 工作区
      - `list_dir(path="...")`: 查看当前 runtime 工作区目录
      - `stat(path="...")`: 查看当前 runtime 工作区文件信息
      - `run_python(scriptPath="...", args=[...], workDir="...", timeoutSeconds=...)`: 执行当前 runtime 中的 Python 脚本
      - `write_artifact(folder="...", fileName="...", sourcePath="..." | content="...")`: 生成最终可下载产物
      - 逻辑路径优先使用 `/workspace`、`/uploads`、`/outputs`、`/temp`、`/logs`、`/skill`、`/profile`
      - listActiveSkills(): 列出当前用户在本次会话可用的全部技能，并标记哪些技能已在当前 runtime 中加载；若当前轮次只是回答“有哪些技能”，同一轮最多只调用一次，拿到结果后直接回答用户
      - loadSkillContent(skillName): 读取某个可用技能的内容与说明，并在当前 runtime 中激活该技能
      - loadSkillReference(skillName, referenceKey): 读取技能提供的参考资料

      Markdown 输出规范：
      - 默认使用清晰、克制、可读的 Markdown
      - 只在有助于阅读时使用标题、列表、表格，不要滥用层级
      - 代码、命令、路径、环境变量、接口字段、配置键请使用反引号包裹
      - 多行代码、SQL、JSON、YAML、Shell 命令请使用 fenced code block，并尽量带上语言标记
      - 列表格式保持统一，避免混用不同风格的列表符号
      - 不要输出破损的 Markdown，例如未闭合的代码块、未配对的强调符号、层级混乱的列表
      - 如果内容适合结构化表达，优先使用短段落 + 列表，而不是一整段堆叠文本

      风格要求：
      - 回答尽量简洁、结构化、可执行
      - 结论优先，必要时补充依据、步骤和注意事项
      - 对不确定的信息要明确说明不确定性来源
    context:
      # History window size per session
      max-messages: ${APP_CHAT_CONTEXT_MAX_MESSAGES:50}
      max-history-tokens: ${APP_CHAT_CONTEXT_MAX_HISTORY_TOKENS:32000}
      max-user-message-chars: ${APP_CHAT_CONTEXT_MAX_USER_MESSAGE_CHARS:change-me-user}
      max-assistant-message-chars: ${APP_CHAT_CONTEXT_MAX_ASSISTANT_MESSAGE_CHARS:1200}
      max-system-message-chars: ${APP_CHAT_CONTEXT_MAX_SYSTEM_MESSAGE_CHARS:400}
      max-summary-message-chars: ${APP_CHAT_CONTEXT_MAX_SUMMARY_MESSAGE_CHARS:1600}
  embedding:
    dimensions: ${APP_EMBEDDING_DIMENSIONS:1024}
  rag:
    elasticsearch:
      base-url: http://127.0.0.1:9200
      api-key: change-me-api-key
      index-name: rag_chunks
      dimensions: ${app.embedding.dimensions}
      similarity: cosine
      shards: 1
      replicas: 0
    retrieval:
      bm25-topk: 40
      vector-topk: 40
      rrf-k: 60
      rrf-topk: 30
      max-result-window: 20
      rerank-input-topk: 30
      final-topn: 8
    rerank:
      timeout-ms: 1200
      fallback-rrf: true
    qa:
      preference-expire-rounds: 10
      low-rerank-threshold: 0.35
      fallback-disclaimer: "以上回答基于通用模型能力，非知识库依据。"
  skills:
    root-dir: ${APP_SKILLS_ROOT_DIR:workspaces/public/skills}
    package:
      password: ${SKILL_PACKAGE_PASSWORD:change-me-password}
    installer:
      enable-dependency-install: true
      python-command: python3.11
      pip-args: "-m pip install -r"
      pip-index-url: ${APP_SKILLS_INSTALLER_PIP_INDEX_URL:${PIP_INDEX_URL:https://pypi.tuna.tsinghua.edu.cn/simple}}
      continue-on-dependency-error: true
lingz:
  runtime:
    provider: NATIVE
    workspace-base-dir: ${LINGZ_RUNTIME_WORKSPACE_BASE_DIR:workspaces}
    command-timeout-seconds: 600
    max-bash-output-chars: 20000
    max-read-file-chars: 50000
    max-model-rounds-per-run: ${LINGZ_RUNTIME_MAX_MODEL_ROUNDS_PER_RUN:12}
    max-tool-calls-per-run: ${LINGZ_RUNTIME_MAX_TOOL_CALLS_PER_RUN:24}
    max-prompt-tokens-per-run: ${LINGZ_RUNTIME_MAX_PROMPT_TOKENS_PER_RUN:1800000}
    max-completion-tokens-per-run: ${LINGZ_RUNTIME_MAX_COMPLETION_TOKENS_PER_RUN:400000}
    max-total-tokens-per-run: ${LINGZ_RUNTIME_MAX_TOTAL_TOKENS_PER_RUN:2000000}
    python-command: python3.11
    pip-index-url: ${LINGZ_RUNTIME_PIP_INDEX_URL:${PIP_INDEX_URL:https://pypi.tuna.tsinghua.edu.cn/simple}}
  sso:
    enabled: true
    shared-secret: ${APP_SSO_SHARED_SECRET:change-me-shared-secret}
    request-expire-seconds: 300
    nonce-expire-seconds: 300
    allowed-source-systems: oa

model:
  qwen:
    chat:
      temperature: ${MODEL_QWEN_CHAT_TEMPERATURE:}
      max-tokens: ${MODEL_QWEN_CHAT_MAX_TOKENS:}
      system-prompt: ${MODEL_QWEN_CHAT_SYSTEM_PROMPT:}
      enable-thinking: ${MODEL_QWEN_CHAT_ENABLE_THINKING:false}
    embedding:
      dimensions: ${MODEL_QWEN_EMBEDDING_DIMENSIONS:${APP_EMBEDDING_DIMENSIONS:1024}}
    rerank:
      protocol: ${MODEL_QWEN_RERANK_PROTOCOL:dashscope}
      timeout-ms: ${MODEL_QWEN_RERANK_TIMEOUT_MS:${APP_RAG_RERANK_TIMEOUT_MS:1200}}
      fallback-rrf: ${MODEL_QWEN_RERANK_FALLBACK_RRF:${APP_RAG_RERANK_FALLBACK_RRF:true}}
  vllm:
    chat:
      temperature: ${MODEL_VLLM_CHAT_TEMPERATURE:${CHAT_TEMPERATURE:0.7}}
      max-tokens: ${MODEL_VLLM_CHAT_MAX_TOKENS:${CHAT_MAX_TOKENS:20000}}
      system-prompt: ${MODEL_VLLM_CHAT_SYSTEM_PROMPT:}
      enable-thinking: ${MODEL_VLLM_CHAT_ENABLE_THINKING:false}
    embedding:
      dimensions: ${MODEL_VLLM_EMBEDDING_DIMENSIONS:0}
    rerank:
      protocol: ${MODEL_VLLM_RERANK_PROTOCOL:vllm}
      timeout-ms: ${MODEL_VLLM_RERANK_TIMEOUT_MS:${APP_RAG_RERANK_TIMEOUT_MS:1200}}
      fallback-rrf: ${MODEL_VLLM_RERANK_FALLBACK_RRF:${APP_RAG_RERANK_FALLBACK_RRF:true}}
